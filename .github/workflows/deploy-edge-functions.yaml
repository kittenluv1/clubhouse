name: Deploy Edge Functions
on:
  push:
    branches: [dev, main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy to development
        if: github.ref == 'refs/heads/dev'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_EDGE_FUNCTIONS_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_EDGE_FUNCTIONS_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
